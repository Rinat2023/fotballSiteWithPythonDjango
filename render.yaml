services:
  - type: web
    name: football-site
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn myproject.wsgi:application"
    plan: free

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "football-site.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: football-db
          property: connectionString

databases:
  - name: football-db
    databaseName: football
    user: football
    plan: free