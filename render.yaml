services:
  - type: web
    name: football-site
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn myproject.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: football-db
          property: connectionString

databases:
  - name: football-db
    databaseName: football
    user: football